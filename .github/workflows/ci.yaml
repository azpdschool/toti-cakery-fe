name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Non-blocking dulu: saat workflow ini dibuat masih ada 40 error lint
      # warisan di src/services/*. Hasilnya tetap terlihat di log. Hapus
      # continue-on-error setelah error itu dibereskan supaya jadi gate beneran.
      - run: npm run lint
        continue-on-error: true

      # tsc -b ikut jalan di sini lewat script build.
      - run: npm run build

  docker:
    name: Build image + smoke test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          TAG=$(echo "$TAGS" | head -n1)
          docker run -d --name fe -p 8080:80 "$TAG"

          for _ in $(seq 1 15); do
            if curl -fsS http://localhost:8080/healthz > /dev/null; then
              break
            fi
            sleep 2
          done

          # nginx harus tetap hidup walau backend tidak ada.
          curl -fsS http://localhost:8080/healthz > /dev/null \
            || { echo "::error::/healthz tidak menjawab"; docker logs fe; exit 1; }

          curl -fsS http://localhost:8080/ > /dev/null \
            || { echo "::error::index.html tidak tersaji"; docker logs fe; exit 1; }

          # SPA fallback: route client-side tidak boleh 404.
          curl -fsS http://localhost:8080/seller/dashboard > /dev/null \
            || { echo "::error::SPA fallback tidak jalan"; docker logs fe; exit 1; }

          # Alamat backend tidak boleh ikut tertanam di bundle produksi.
          if docker run --rm "$TAG" \
               grep -rq "localhost:8000" /usr/share/nginx/html/assets/; then
            echo "::error::bundle memuat http://localhost:8000 — VITE_API_BASE_URL salah"
            exit 1
          fi

          echo "smoke test lolos"
          docker rm -f fe > /dev/null

      - name: Login ke GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while read -r tag; do
            if [ -n "$tag" ]; then
              docker push "$tag"
            fi
          done
