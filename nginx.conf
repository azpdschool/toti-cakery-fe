map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 10m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;   # DNS internal Docker
        set $upstream_be backend:8000;   # nama service di compose

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_be;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $fwd_proto;
        proxy_set_header X-Forwarded-Prefix /api;
        # Dua aturan, yang paling spesifik lebih dulu; nginx memakai yang
        # pertama cocok.
        #
        # Backend yang sudah memakai root_path="/api" mengirim Location yang
        # prefiksnya lengkap -- yang perlu dibetulkan tinggal skemanya. Tanpa
        # aturan pertama, aturan kedua akan menambahkan /api sekali lagi dan
        # menghasilkan /api/api/products/.
        proxy_redirect ~^https?://[^/]+(/api/.*)$ $fwd_proto://$host$1;
        # Backend tanpa root_path mengirim Location tanpa prefiks: kembalikan
        # prefiksnya sekaligus skemanya.
        proxy_redirect ~^https?://[^/]+(/.*)$     $fwd_proto://$host/api$1;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
