map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 10m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Prefiks /api DITERUSKAN apa adanya, tidak dibuang.
    #
    # Backend berjalan dengan root_path="/api", jadi ia memang mengharapkan
    # prefiks itu utuh dan melepasnya sendiri saat mencocokkan rute. Dulu di
    # sini ada `rewrite ^/api/(.*)$ /$1 break;` -- peninggalan dari sebelum
    # root_path ada -- dan itu membuat berkas statis tidak pernah terjangkau:
    # foto produk hidup di mount /static milik backend, yang dengan root_path
    # hanya menjawab di /api/static/..., sementara rewrite mengubahnya menjadi
    # /static/... sehingga selalu 404. Diuji: dengan rewrite, gambar produk
    # mustahil tampil lewat situs walau backend menyajikannya dengan benar.
    #
    # KONSEKUENSI: berkas ini menuntut backend yang memakai root_path="/api".
    # Dipasangkan dengan backend lama yang tidak memakainya, seluruh /api/ akan
    # 404.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;   # DNS internal Docker
        set $upstream_be backend:8000;   # nama service di compose

        proxy_pass http://$upstream_be;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # $fwd_proto, bukan $scheme: TLS diterminasi Cloudflare, jadi $scheme di
        # sini selalu http dan uvicorn --proxy-headers akan menyusun URL http
        # di halaman https.
        proxy_set_header X-Forwarded-Proto  $fwd_proto;
        proxy_set_header X-Forwarded-Prefix /api;

        # Prefiksnya sudah benar karena tidak dibuang; yang tersisa cuma
        # membetulkan skema pada Location absolut yang dikirim FastAPI.
        proxy_redirect ~^https?://[^/]+(/.*)$ $fwd_proto://$host$1;

        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
